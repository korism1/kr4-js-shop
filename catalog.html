<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Bootstrap Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/catalog.js" defer></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Bootstrap Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
          <li class="nav-item"><a class="nav-link" href="order.html">Заявка</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Дополнительно</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="catalog.html">Все товары</a></li>
              <li><a class="dropdown-item" href="order.html">Оформить заявку</a></li>
              <li><a class="dropdown-item" href="index.html#popular">Популярное</a></li>
              <li><a class="dropdown-item" href="contacts.html">Контакты</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
      <h1 class="h2 mb-0">Каталог товаров</h1>
      <a class="btn btn-outline-primary" href="order.html">Оставить заявку</a>
    </div>

    <section class="catalog-controls row g-3 mb-3" aria-label="Управление каталогом">
      <div class="col-12 col-md-4">
        <label class="form-label" for="catalog-search">Поиск товара</label>
        <input class="form-control" id="catalog-search" type="search" placeholder="Например, Zenbook" autocomplete="off">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label" for="category-filter">Категория</label>
        <select class="form-select" id="category-filter">
          <option value="all">Все категории</option>
          <option value="macos">Ноутбуки macOS</option>
          <option value="ultrabooks">Ультрабуки Windows</option>
          <option value="large-screen">Ноутбуки 16″</option>
        </select>
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label" for="sort-select">Сортировка</label>
        <select class="form-select" id="sort-select">
          <option value="default">По умолчанию</option>
          <option value="price-asc">Сначала дешевле</option>
          <option value="price-desc">Сначала дороже</option>
          <option value="title-asc">По названию А–Я</option>
        </select>
      </div>
    </section>

    <p class="catalog-count text-body-secondary" aria-live="polite"></p>
    <p class="catalog-empty alert alert-info" hidden>По выбранным условиям товары не найдены.</p>
    <div class="products-grid row g-4" data-products-container></div>
    <noscript><p>Для просмотра каталога включите JavaScript.</p></noscript>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
